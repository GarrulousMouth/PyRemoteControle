<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>RemoteControl</title>
    <style>
        :root {
            --gradient-color: linear-gradient(135deg, #00FFFF 0%, #0000FF 100%);
            --gradint-color-selected: linear-gradient(135deg, #00DEE2 0%, #0609CD 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #050A30;
            color: #fff;
            font-size: 14px;
            line-height: 148%;
            font-family: "Montserrat", 'Inter', sans-serif;
        }

        svg,
        svg * {
            pointer-events: none;
        }

        .container {
            position: relative;
            width: 335px;
            margin: 0 auto;
            margin-top: 32px;
            display: flex;
            flex-direction: column;

        }

        .box-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--gradient-color);
            border-radius: 100px;
            height: 100%;
            cursor: pointer;
            transition: background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .box-btn:active {
            background: var(--gradint-color-selected);
        }

        .box-btn path {
            fill: white;
        }

        

        .box-change-input {
            width: 100%;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .box-btn-settings {
            width: 48px;
            height: 48px;

        }

        .box-btn-remote {
            height: 48px;
            width: 267px;
        }

        .box-arrow {
            background-color: #FFFFFF1A;
            height: 48px;
            width: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 100px;
            cursor: pointer;

        }

        h5 {
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .box-arrow {
            fill: white;
        }

        .box-title-setting {
            display: flex;
            justify-content: space-between;
            margin-bottom: 48px;
            align-items: center;
        }

        h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .box-elements {
            width: 100%;
            overflow: hidden;
        }

        .box-controller {
            display: flex;
            width: 200%;
            transition: transform 0.5s ease-in-out;
            transform: translateX(-50%);
        }

        .checkbox-btn {
            display: none;
        }

        .checkbox-label {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--gradient-color);
            border-radius: 100px;
            height: 100%;
            cursor: pointer;
            transition: background-color 0.3s;
            height: 48px;
            -webkit-tap-highlight-color: transparent;
        }


        .checkbox-btn:checked+.checkbox-label {
            background: var(--gradint-color-selected);
        }


        .mouse,
        .keyboard,
        .settings {

            width: 50%;
            flex-shrink: 0;
            position: relative;
        }

        .mouse {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .body-mouse {
            border: 4px solid #fff;
            border-radius: 200px 200px 200px 200px;
            display: flex;
            width: 243px;
            flex-direction: column;
            margin-bottom: 32px;
            transition: all 0.5s ease-out;
        }

        .body-mouse--square {
            border-radius: 200px 200px 20px 20px !important;
        }


        .mouse-touch {
            touch-action: none;
            border-radius: 20px 20px 1000px 1000px;
            height: 225px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .mouse-touch--square {
            border-radius: 0 !important;
        }

        .icon-touchpad {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 100px;
            width: 48px;
            height: 48px;
            background-color: #FFFFFF20;
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .border-block {
            border-radius: 20px;
        }

        .touchpad-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .button-mouse {
            width: 126px;
            border-bottom: 4px solid #fff;
            height: 158px;
        }

        .button-mouse:active {
            background: #FFFFFF16;
        }

        .mouse-left {
            border-radius: 1000px 0 0 0;
            border-right: 4px solid #fff;
        }

        .mouse-right {
            border-radius: 0 1000px 0 0;
        }

        .mouse-middle {
            position: absolute;
            width: 40px;
            height: 80px;
            background: var(--gradient-color);
            border: 4px solid #fff;
            border-radius: 100px;
            z-index: 3;
            touch-action: none;
        }

        .mouse-middle:active {
            background: var(--gradint-color-selected);
        }

        .group-button {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .group-button__center {
            justify-content: center;
        }

        .group-button__arows {
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            height: 132px;
        }


        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 100px;
            position: relative;
            background: #FFFFFF1A;
        }

        .button:active {
            background: #FFFFFF25;
        }

        .button-command:not(:last-child) {
            margin-right: 24px;
        }

        .keyboard-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            width: 99%;
            font-size: 14px;
            height: 40px;
            display: flex;
            justify-content: center;
            border: 1px solid #FFFFFF40;
            border-radius: 100px;
        }

        .input-wrapper_m {
            margin-bottom: 48px;
        }

        .input-string {
            width: 100%;
            padding: 0;
            color: transparent;
            caret-color: transparent;
            background-color: transparent;
            border: none;
            border-radius: 100px;

        }

        .input-string:active {
            background-color: #FFFFFF16;

        }

        .input-string:active,
        .input-string:focus {
            outline: none;
        }

        .input-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        /* .not-selected {
            border: 1px solid red;
            border-radius: 100px;
        } */

        .not-selected::after {
            content: "";
            height: 12px;
            width: 12px;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 4 4" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 2L4 2M2 4L2 0" stroke="white" stroke-width="0.64" stroke-linejoin="round"/></svg>');
            background-color: #00CC00;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 4px 4px;
            position: absolute;
            top: 2px;
            right: 2px;
            border-radius: 100px;
        }

        /* .selected {
            border: 1px solid green;
        } */

        .selected::after {
            content: "";
            height: 12px;
            width: 12px;
            background-image: url('data:image/svg+xml;utf8,<svg width="4" height="4" viewBox="0 0 4 4" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.226286 3.0547L3.05471 0.226274M3.05471 3.0547L0.226286 0.226274" stroke="white" stroke-width="0.64" stroke-linejoin="round"/></svg>');
            background-color: #FF0000;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 4px 4px;
            position: absolute;
            top: 2px;
            right: 2px;
            border-radius: 100px;
        }

        .container-lock {
            display: flex;
            align-items: center;
            margin-right: 12px;
        }

        .container-hotkeys {
            display: flex;
        }

        #container-hotkeys {
            position: fixed;
            z-index: 5;
            background-color: #050A30;
            top: 20px;
            height: 150px;
            /* left: 23vw; */
            margin: 0 auto;
            width: 335px;
            border-bottom: 2px solid #414562;
            border-radius: 0 0 20px 20px;
            transform: translateY(-130px);
            transition: all 0.5s ease-out;
        }

        #openHotkeys {
            width: 100%;
            height: 40px;
        }
        #visible-hotkeys {
            width: 100%;
        }

        .btn-open {
            position: absolute;
            bottom: 20px;
            left: 143px;

            display: block;
            height: 4px;
            width: 48px;
            background-color: #414562;
            border-radius: 5px;
        }

        .change-transform-hotkeys {
            transform: translateY(0) !important;
        }

        .change-transform-bodymouse {
            transform: translateY(80px) !important;
        }

        .notvisible-transform-hotkeys {
            transform: translateY(-200px) !important;
        }

        .d-none {
            display: none !important;
        }

        .box-hotkeys {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .checkbox-settings {
            appearance: none;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            margin-left: 0;
            border: 1.25px solid #FFFFFF;
            border-radius: 6px;
            /* background: linear-gradient(135deg, #00FFFF, #0000FF); */
        }

        .checkbox-settings:checked {
            background: var(--gradient-color);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 0;

        }

        .checkbox-settings:disabled {
            border: 1.25px solid #FFFFFF52;
            background: none;
        }

        .checkbox-settings:checked::after {
            content: "";
            display: block;
            background: url('data:image/svg+xml;utf8,<svg width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.625 3.455L3.455 6.285L9.125 0.625" stroke="white" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            height: 8.5px;
            width: 8.5px;
            background-repeat: no-repeat;
        }

        .box-checkbox-settings {
            display: flex;
            align-items: center;
        }

        .box-checkbox-settings:not(:last-child) {
            margin-bottom: 12px;
        }

        .box-checkbox-settings:has(+ :not(.box-checkbox-settings)) {
            margin-bottom: 20px;
        }

        .range {
            -webkit-appearance: none;
            background: transparent;
            appearance: none;
            border-radius: 2px;
            width: 300px;
        }

        .box-range-input {
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .range::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #00FFFF, 15%, #0000FF) no-repeat #FFFFFF29;
            background-size: var(--progress, 0%) 100%;
            height: 4px;
            border-radius: 2px;
        }

        .range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to bottom, #00FFFF, 15%, #0000FF);
            background-repeat: no-repeat;
            border: 0;
            margin-top: -4px;
            height: 12px;
            width: 12px;
            border-radius: 50%;
        }

        .range::-moz-range-track {
            background: #FFFFFF29;
            border-radius: 2px;
            height: 4px;
        }

        .range::-moz-range-thumb {
            background: linear-gradient(135deg, #00FFFF, 10%, #0000FF);
            background-repeat: no-repeat;
            border: 0;
            height: 12px;
        }

        .range::-moz-range-progress {
            border-radius: 2px;
            background: linear-gradient(to right, #00FFFF, 15%, #0000FF);
            height: 4px;
        }

        .weight-1 {
            grid-column: span 1;
        }

        .weight-2 {
            grid-column: span 2;
        }

        .weight-3 {
            grid-column: span 3;
        }

        .weight-4 {
            grid-column: span 4;
        }

        .weight-5 {
            grid-column: span 5;
        }
    </style>
    <link rel="shortcut icon" href="#" type="image/x-icon">

</head>

<body>
    <div class="container">
        <div class="notvisible-transform-hotkeys" id="container-hotkeys">
            <div class="input-wrapper" data-action-keyboard="text" style="margin-bottom: 20px;">
                <input class="input-string" autocapitalize="none" type="text" name="hidden-input" data-input="text">
                <label for="hidden-input" class="input-label">Активировать ввод</label>
            </div>
            <div class="container-hotkeys">
                <div class="container-lock">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 17.35C12.9002 17.35 13.63 16.6202 13.63 15.72C13.63 14.8198 12.9002 14.09 12 14.09C11.0998 14.09 10.37 14.8198 10.37 15.72C10.37 16.6202 11.0998 17.35 12 17.35Z"

                        <defs>
                            <linearGradient id="paint0_linear_38_174" x1="2" y1="2" x2="22" y2="22"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00FFFF" />
                                <stop offset="1" stop-color="#0000FF" />
                            </linearGradient>
                            <linearGradient id="paint1_linear_38_174" x1="2" y1="2" x2="22" y2="22"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00FFFF" />
                                <stop offset="1" stop-color="#0000FF" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <div class="box-hotkeys" id="box-hotkeys">


                </div>
            </div>
            <div id="openHotkeys">
                <span class="btn-open"></span>
            </div>

        </div>
        <div class="box-elements">
            <div class="box-controller" id="box-controller">


                <div class="settings" id="settings">
                    <div class="box-title-setting">
                        <h3>Настройки</h3>
                        <div class="box-arrow" id="backToMainFromSettings">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M13.9883 5.48762C14.2323 5.24392 14.6281 5.24381 14.8721 5.48762L20.9424 11.5579C21.0595 11.6751 21.125 11.8346 21.125 12.0003C21.1249 12.1658 21.0593 12.3246 20.9424 12.4417L14.8721 18.512C14.628 18.7561 14.2324 18.756 13.9883 18.512C13.7442 18.268 13.7442 17.8723 13.9883 17.6282L18.9902 12.6253H3.5C3.15493 12.6253 2.87517 12.3453 2.875 12.0003C2.875 11.6551 3.15482 11.3753 3.5 11.3753H18.9912L13.9883 6.37238C13.7442 6.1283 13.7442 5.73169 13.9883 5.48762Z"
                                    fill="white" />
                            </svg>

                        </div>
                    </div>
                    <div>
                        <h5>Трансляция</h5>
                        <div class="box-checkbox-settings">
                            <input class="checkbox-settings" type="checkbox" name="activationStream"
                                id="activationStream">
                            <label class="checkbox-settings-label" for="activationStream">Активировать
                                трансляцию</label>
                        </div>
                        <div class="box-checkbox-settings">
                            <input class="checkbox-settings" type="checkbox" name="activationInfinityStream"
                                id="activationInfinityStream" disabled>
                            <label class="checkbox-settings-label" for="activationInfinityStream">Активировать
                                постоянную трансляцию </label>
                        </div>
                        <div class="box-checkbox-settings">
                            <input class="checkbox-settings" type="checkbox" name="activationSquare"
                                id="activationSquare">
                            <label class="checkbox-settings-label" for="activationSquare">Увеличить размер
                                трансляции</label>
                        </div>
                        <div>
                            <label class="range-label" for="rangeZoom">Увеличить zoom трансляции</label>
                            <div class="box-range-input">
                                <input class="range" type="range" name="rangeZoom" id="rangeZoom" min="0.5" max="5"
                                    value="1" step="0.5" oninput="rangeZoomOutput.value = rangeZoom.value">
                                <output id="rangeZoomOutput" for="rangeZoom"></output>
                            </div>


                        </div>

                    </div>
                    <div>
                        <h5>Мышь</h5>
                        <div>
                            <label class="range-label" for="rangeSensitivity">Изменить скорость мыши</label>
                            <div class="box-range-input">
                                <input class="range" type="range" name="rangeSensitivity" id="rangeSensitivity"
                                    min="0.5" max="6" value="2.5" step="0.5"
                                    oninput="rangeSensitivityOutput.value = rangeSensitivity.value">
                                <output id="rangeSensitivityOutput" for="rangeSensitivity"></output>
                            </div>

                        </div>
                        <div>
                            <label class="range-label" for="rangeScroll">Изменить скорость скролла</label>

                            <div class="box-range-input">
                                <input class="range" type="range" name="rangeScroll" id="rangeScroll" min="0.03" max="1"
                                    value="0.1" step="0.03" oninput="rangeScrollOutput.value = rangeScroll.value">
                                <output id="rangeScrollOutput" for="rangeScroll"></output>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h5>Общие настройки</h5>
                        <div class="box-checkbox-settings">
                            <input class="checkbox-settings" type="checkbox" name="fixedQuick" id="fixedQuick">
                            <label class="checkbox-settings-label" for="fixedQuick">Закрепить быстрые клавиши</label>
                        </div>

                    </div>
                </div>
                <div class="mouse" id="mouse">
                    <div class="box-change-input">
                        <div class="box-btn box-btn-settings" id="changeSettings">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">

        <script>
            /* 
            Комментарии тут мои, а не ИИ. Да, код, вероятно, не идеален,
            но хотя бы написан мной с душой, любовью, гуглом и всё такое.
            А комментарии чисто для души, чтобы не забыть вообще, что, где
            и зачем делает.
            */
            let socket;
            let url = `ws://${window.location.host}/ws`

            let clickCount = 0;
            let clickTimer;
            let limitQuickButton = 5;
            let isMoving = false;

            let activePointers = new Map();
            let isScrolling = false;
            let isSelectionMode = false;

            const boxController = document.getElementById("box-controller");

            const sliders = document.querySelectorAll('.range');

            function handleSliderProgress(slider) {
                const min = parseFloat(slider.min) || 0;
                const max = parseFloat(slider.max) || 100;
                const value = parseFloat(slider.value);

                const percentage = ((value - min) / (max - min)) * 100;

                slider.style.setProperty('--progress', `${percentage}%`);
            }


            function setSettingsLocalStorage() {
                isStreamTemporaryActive = JSON.parse(localStorage.getItem("activationStream")) || false;
                isInfinityStreamActive = JSON.parse(localStorage.getItem("infinityStream")) || false;

                if (isStreamTemporaryActive) {
                    document.getElementById("activationStream").checked = true;
                    let infinityStream = document.getElementById("activationInfinityStream");
                    infinityStream.disabled = false;
                    if (isInfinityStreamActive) {
                        infinityStream.checked = true;
                    }
                }

                if (JSON.parse(localStorage.getItem("square"))) {
                    document.getElementById("activationSquare").checked = true;

                    let bodyMouse = document.getElementsByClassName("body-mouse")[0];

                    bodyMouse.classList.toggle("body-mouse--square");
                    touchpad.classList.toggle("mouse-touch--square");
                }
                if (JSON.parse(localStorage.getItem("fixedQuick"))) {
                    document.getElementById("fixedQuick").checked = true;
                    let containerHotkeys = document.getElementById("container-hotkeys");
                    containerHotkeys.classList.remove("notvisible-transform-hotkeys");
                }

                document.getElementById("rangeZoom").value = localStorage.getItem("zoom") || 2;
                document.getElementById("rangeZoomOutput").textContent = localStorage.getItem("zoom") || 2;

                document.getElementById("rangeSensitivity").value = localStorage.getItem("sensitivity") || 2.5;
                document.getElementById("rangeSensitivityOutput").textContent = localStorage.getItem("sensitivity") || 2.5;

                document.getElementById("rangeScroll").value = localStorage.getItem("scroll") || 0.1
                document.getElementById("rangeScrollOutput").textContent = localStorage.getItem("scroll") || 0.1

                sliders.forEach(slider => {
                    slider.addEventListener('input', () => handleSliderProgress(slider));

                    handleSliderProgress(slider);
                });



                socket.send(JSON.stringify({
                    input: "settings",
                    mouse: [
                        {
                            type: "settings",
                            setting: "sensitivity",
                            value: localStorage.getItem("sensitivity") || 2.5
                        },
                        {
                            type: "settings",
                            setting: "scroll",
                            value: localStorage.getItem("scroll") ?? 0.1
                        },
                    ],
                    stream: JSON.parse(localStorage.getItem("activationStream")) || false,
                    settingStream: {
                        "canvas_width": canvas.width,
                        "canvas_height": canvas.height,
                        "zoom": localStorage.getItem("zoom") || 2,
                    }
                }))

                sendStreamState(isInfinityStreamActive);
            }


            function connect() {
                console.log("Connection attempt")
                socket = new WebSocket(url)

                socket.onopen = () => {
                    console.log("Connection completed")

                    if (typeof resizeCanvas === "function") {
                        resizeCanvas();
                    }
                    if (typeof setSettingsLocalStorage === "function") {
                        setSettingsLocalStorage();
                    }
                }

                socket.onclose = (e) => {
                    console.log("Connection lost. Reconnection")
                    setTimeout(() => {
                        connect();
                    }, 2000);
                }

                socket.onerror = (err) => {
                    console.log("Connection error. Connection closed")
                    socket.close();
                }
            }

            connect();

            const touchpad = document.getElementById('touchpad');

            // Отслеживание нажатия на тачпад
            touchpad.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                let iconTouchpad = document.getElementsByClassName("icon-touchpad");
                iconTouchpad[0].style.display = "none"
                /*
                Переменная для отслеживания колиечества кликов.
                Там дальше идёт таймер, чтобы в это время отследить,
                был второй клик или нет, чтобы можно было объекты перемещать
                и всё такое.
                */
                clickCount++;
                clearTimeout(clickTimer)
                isMoving = false;
                /*
                А здесь проверка на то сколько пальцев нажато для активации
                скролла.
                */
                sendStreamState(true);
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
                if (clickCount === 1) {
                    clickTimer = setTimeout(() => {
                        if (!isMoving) {
                            socket.send(JSON.stringify({ input: "mouse", type: "clickLeft" }));
                            clickCount = 0
                        }
                    }, 200);
                }
                else if (activePointers.size === 2) {
                    isScrolling = true;
                }
                else if (clickCount === 2) {
                    clearTimeout(clickTimer);
                    socket.send(JSON.stringify({ input: "mouse", type: "dragAndDrop", command: "press" }))
                }

            }, { passive: false });

            // Отслеживание поднятия пальца и очищение всех переменных
            touchpad.addEventListener('pointerup', (e) => {
                let iconTouchpad = document.getElementsByClassName("icon-touchpad");
                iconTouchpad[0].style.display = "flex"

                sendStreamState(false);

                isScrolling = false;
                activePointers.delete(e.pointerId);
                if (clickCount >= 2) {
                    socket.send(JSON.stringify({ input: "mouse", type: "dragAndDrop", command: "release" }))
                    console.log(clickCount)
                    clickCount = 0;
                }

            }, { passive: false });

            let lastSendTime = 0;
            const THROTTTLE_MS = 8;

            // Здесь передвижение пальца по тачпаду и отправка дельты на сервер
            touchpad.addEventListener("pointermove", function (e) {
                e.preventDefault();
                isMoving = true;
                clearTimeout(clickTimer)
                if (clickCount < 2 || isScrolling) {
                    clickCount = 0;
                }
                const dx = e.movementX;
                const dy = e.movementY;
                if (Date.now() - lastSendTime > THROTTTLE_MS) {
                    requestAnimationFrame(() => {

                        if (isScrolling) {
                            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                                socket.send(JSON.stringify({ input: "mouse", type: "scroll", y: dy }));
                            }
                        } else {
                            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                                socket.send(JSON.stringify({ input: "mouse", type: "move", x: dx, y: dy }));
                            }
                        }
                    })
                }

                lastSendTime = Date.now();

            }, { passive: false });

            // Добавление кнопок быстрого доступа, сохранённый в localstorage
            function addQuickButtons() {

                // const containerQuickButtons = document.getElementById("box-quick-buttons");
                const containersQuickButtons = document.querySelectorAll('.box-hotkeys');
                let quickButtons = JSON.parse(localStorage.getItem("quickButtons")) || [];
                quickButtons.sort((a, b) => b.weight - a.weight);
                limitQuickButton = limitQuickButton - quickButtons.length >= 0 ? limitQuickButton - quickButtons.length : 0;

                containersQuickButtons.forEach((containerQuickButtons) => {
                    containerQuickButtons.innerHTML = "";
                    console.log("banana")

                    console.log(quickButtons.length);
                    if (quickButtons.length > 0) {
                        document.getElementById("container-quick-btn").classList.remove("d-none");
                    }

                    quickButtons.forEach((elem) => {
                        let elementForCopy = document.querySelector(`[data-action-${elem.type}="${elem.action}"]`)
                        let elementCopy = elementForCopy.cloneNode(true);
                        elementCopy.removeAttribute("data-weight");
                        elementCopy.style.marginBottom = "0";
                        elementCopy.style.marginRight = "0";
                        elementCopy.classList.add(`weight-${elem.weight}`);
                        containerQuickButtons.appendChild(elementCopy);
                    })
                })

            }

            addQuickButtons();

            // Перемещние мыши при открытии  быстрых клавиш сверху
            function changeTransfromHotkeys() {
                let containerHotkyes = document.getElementById("container-hotkeys");
                containerHotkyes.classList.toggle("change-transform-hotkeys");

                let mainHotkeys = document.getElementById("visible-hotkeys");
                mainHotkeys.classList.toggle("d-none");

                let bodyMouse = document.querySelector(".body-mouse");
                bodyMouse.classList.toggle("change-transform-bodymouse")

            }

            // Начало инициализации всех кнопок
            document.addEventListener('click', (event) => {
                // Событие тачпада не отслеживаем
                if (event.target.closest('#touchpad')) {
                    return;
                }

                // Здесь добавление кнопок в быстрый доступ
                if (isSelectionMode) {
                    let btnChoice = event.target.closest("[data-weight]");
                    console.log(btnChoice)
                    if (btnChoice) {
                        const fullKey = Object.keys(btnChoice.dataset).find(key => key.startsWith('action'));
                        let actionType = '';
                        let actionValue = '';

                        if (fullKey) {
                            actionType = fullKey.replace('action', '').toLowerCase();

                            actionValue = btnChoice.dataset[fullKey];

                            console.log(`Тип: ${actionType}, Значение: ${actionValue}`);
                        }
                        if (btnChoice.classList.contains("input-wrapper")) {
                            actionType = "keyboard";
                            actionValue = "text";
                        }

                        if (checkElementToListLocalStorage(actionValue)) {
                            deleteElementToListLocalStorage(actionValue)

                            btnChoice.classList.add("not-selected");
                            btnChoice.classList.remove('selected');


                        } else {
                            if (limitQuickButton > 0) {
                                addElementToListLocalStorage({ type: actionType, action: actionValue, weight: btnChoice.dataset.weight })

                                btnChoice.classList.remove("not-selected");
                                btnChoice.classList.add('selected');
                            }
                        }
                    }
                    return;
                }

                let btnOpenHotkeys = event.target.closest("#openHotkeys");
                if (btnOpenHotkeys) {
                    changeTransfromHotkeys()
                }

                let btnChangeInput = event.target.closest("#changeInput");
                if (btnChangeInput) {
                    boxController.style.transform = "translateX(-100%)";
                    return;
                }

                let btnChangeSettings = event.target.closest("#changeSettings");
                if (btnChangeSettings) {
                    boxController.style.transform = "translateX(0%)";
                    return;
                }


                let backToMainFromSettings = event.target.closest("#backToMainFromSettings");
                if (backToMainFromSettings) {
                    boxController.style.transform = "translateX(-50%)";
                    return
                }

                let backToMainFromButtons = event.target.closest("#backToMainFromButtons");
                if (backToMainFromButtons) {
                    boxController.style.transform = "translateX(-50%)";
                    return;
                }


                // Обработка клавиш мыши
                let btnMouse = event.target.closest("[data-action-mouse]");
                if (btnMouse) {
                    socket.send(JSON.stringify({
                        input: "mouse",
                        type: btnMouse.dataset.actionMouse
                    }))
                    return;
                }
                // Обработка клавиш мультимедиа
                let btnButton = event.target.closest("[data-action-button]");
                if (btnButton) {
                    socket.send(JSON.stringify({
                        input: "keyboard",
                        type: 'key',
                        value: btnButton.dataset.actionButton
                    }));
                    return;
                }
                // Обработка клавиш для комманд, типа вставки, копирования и т.д.
                let btnCommand = event.target.closest("[data-action-command]");
                if (btnCommand) {
                    socket.send(JSON.stringify({
                        input: "keyboard",
                        type: 'systemCommand',
                        value: btnCommand.dataset.actionCommand
                    }));
                    return;
                }
            });

            let middleClick = document.getElementById("middle-click")
            // А тут отслеживание средней кнопки мыши, чтобы  можно было скроллить
            middleClick.addEventListener("pointermove", (e) => {
                const dy = e.movementY;
                if (Math.abs(dy) > 0) {
                    socket.send(JSON.stringify({ input: "mouse", type: "scroll", y: dy }));
                }
            })

            /* 
            Дальше идёт обработка ввода текста с клавиатуры
            */
            document.addEventListener('beforeinput', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input || !socket || socket.readyState !== WebSocket.OPEN) return;

                let char = e.data;

                if (char) {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'text', value: char }));
                } else if (e.inputType === 'deleteContentBackward') {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'key', value: 'backspace' }));
                } else if (e.inputType === 'insertLineBreak') {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'key', value: 'enter' }));
                }

                input.value = "";
            });

            document.addEventListener('mousedown', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                e.preventDefault();

                if (document.activeElement === input) {
                    input.blur();
                } else {
                    input.focus();
                }
            });

            document.addEventListener('focusin', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                if (isSelectionMode) {
                    input.blur();
                    return;
                }

                const parent = input.closest('.input-wrapper') || input.parentElement;
                const labels = parent.querySelectorAll(".input-label");

                labels.forEach((item) => {
                    item.textContent = "Ввод активирован";
                    input.style.background = 'linear-gradient(to right, #63D72A 0%, #53C121 50%, #3D9A16 100%)';
                });
            });

            document.addEventListener('focusout', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                const parent = input.closest('.input-wrapper') || input.parentElement;
                const labels = parent.querySelectorAll(".input-label");

                labels.forEach((item) => {
                    item.textContent = "Активировать ввод";
                    input.style.background = '';
                });
            });

            /*
            Функцит для добавления, удаления и проверки элементов
            в localstorage.
            */
            function addElementToListLocalStorage(newItem) {

                const currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];

                currentList.push(newItem);
                --limitQuickButton;
                localStorage.setItem("quickButtons", JSON.stringify(currentList));
                if (limitQuickButton === 0) {
                    deleteStyleElem();
                }


            }

            function deleteElementToListLocalStorage(oldCommand) {
                let currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];
                currentList = currentList.filter(item => !(item.action === oldCommand))
                if (currentList.length === 0) {
                    console.log(currentList.length)
                    document.getElementById("container-quick-btn").classList.add("d-none");
                }
                ++limitQuickButton;
                addStyleElem();
                localStorage.setItem("quickButtons", JSON.stringify(currentList))
            }

            function checkElementToListLocalStorage(command) {
                const currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];
                return currentList.some(item => item.action === command);
            }

            function deleteStyleElem() {
                let elementsChoice = document.querySelectorAll("[data-weight]");
                elementsChoice.forEach((elem) => {
                    if (elem.classList.contains("not-selected")) {
                        elem.classList.remove("not-selected")
                    }
                })
            }

            function addStyleElem() {
                if (limitQuickButton > 0) {
                    let elementsChoice = document.querySelectorAll("[data-weight]");
                    elementsChoice.forEach((elem) => {
                        if (!elem.classList.contains("selected")) {
                            elem.classList.add("not-selected")
                        }
                    })
                }

            }

            // Приём видео с сервера
            const canvas = document.getElementById('stream-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            let isStreamingActive = false;

            socket.binaryType = "blob";

            function resizeCanvas() {
                canvas.width = touchpad.clientWidth;
                canvas.height = touchpad.clientHeight;

                socket.send(JSON.stringify({
                    "canvas_width": canvas.width,
                    "canvas_height": canvas.height,
                    "zoom": document.getElementById("rangeZoom").value
                }));
            }
            // Добавление отслеживания изменения размеров окна 
            window.addEventListener('resize', resizeCanvas);

            img.onload = function () {
                if (!isStreamingActive) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                URL.revokeObjectURL(img.src);
            };

            // Главный обработчик входящих сообщений
            socket.onmessage = function (event) {
                if (event.data instanceof Blob) {

                    if (!isStreamingActive) {
                        URL.revokeObjectURL(URL.createObjectURL(event.data))
                    }
                    img.src = URL.createObjectURL(event.data);
                }
                else {
                    try {
                        const textData = JSON.parse(event.data);
                        console.log("Получен текст от сервера:", textData);
                    } catch (e) {
                        console.log("Получен не JSON текст:", event.data);
                    }
                }
            };

            function sendStreamState(isEnabled) {
                if (!isStreamTemporaryActive) {
                    return;
                }

                if (isInfinityStreamActive) {
                    isEnabled = isInfinityStreamActive;
                }

                isStreamingActive = isEnabled;

                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ "stream": isEnabled }));
                }

                if (!isInfinityStreamActive) {
                    const ctx = canvas.getContext('2d');
                    console.log(ctx)
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            let isStreamTemporaryActive = document.getElementById("activationStream").checked;

            let isInfinityStreamActive = document.getElementById("activationInfinityStream").checked;

            document.addEventListener("change", (event) => {
                let btnChoice = event.target.closest("#choiceButton");
                let btnChoicelable = document.getElementById("choiceButtonLabel");
                if (btnChoice) {
                    let elementsChoice = document.querySelectorAll("[data-weight]");
                    isSelectionMode = event.target.checked;
                    if (isSelectionMode) {
                        btnChoicelable.textContent = "Сохранить выбор"
                        elementsChoice.forEach((elem) => {
                            let command = elem.dataset.actionButton || elem.dataset.actionCommand || "text";
                            if (checkElementToListLocalStorage(command)) {
                                elem.classList.add("selected")
                            } else {
                                // elem.classList.add("not-selected")
                                addStyleElem();
                            }
                        })
                    } else {
                        btnChoicelable.textContent = "Выбрать кнопки"
                        elementsChoice.forEach((elem) => {
                            elem.classList.remove("not-selected");
                            elem.classList.remove("selected");
                        })
                        addQuickButtons();
                    }
                    return;
                }

                let checkActivationStream = event.target.closest("#activationStream");
                if (checkActivationStream) {
                    isStreamTemporaryActive = checkActivationStream.checked;
                    const isChecked = checkActivationStream.checked

                    localStorage.setItem("activationStream", JSON.stringify(isChecked));

                    if (!isChecked) {
                        socket.send(JSON.stringify({ "stream": false }));

                        isStreamingActive = false;

                        activationInfinityStream.checked = false;

                        isInfinityStreamActive = false;
                        localStorage.setItem("infinityStream", JSON.stringify(false))

                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                    activationInfinityStream.disabled = !isChecked;
                    return;
                }


                let checkInfinityStreamActive = event.target.closest("#activationInfinityStream");
                if (checkInfinityStreamActive) {

                    isInfinityStreamActive = checkInfinityStreamActive.checked;
                    const isChecked = checkInfinityStreamActive.checked;

                    localStorage.setItem("infinityStream", JSON.stringify(isChecked))

                    sendStreamState(isChecked);
                    return
                }

                let checkActivationSquare = event.target.closest("#activationSquare");
                if (checkActivationSquare) {
                    localStorage.setItem("square", JSON.stringify(checkActivationSquare.checked))
                    let bodyMouse = document.getElementsByClassName("body-mouse")[0];

                    bodyMouse.classList.toggle("body-mouse--square");
                    touchpad.classList.toggle("mouse-touch--square");
                    return;
                }

                let rangeZoom = event.target.closest("#rangeZoom");
                if (rangeZoom) {
                    localStorage.setItem("zoom", rangeZoom.value)
                    socket.send(JSON.stringify({
                        "canvas_width": canvas.width,
                        "canvas_height": canvas.height,
                        "zoom": rangeZoom.value
                    }));
                    return;
                }

                let rangeSensitivity = event.target.closest("#rangeSensitivity");
                if (rangeSensitivity) {
                    localStorage.setItem("sensitivity", rangeSensitivity.value)
                    socket.send(JSON.stringify({
                        input: "mouse",
                        type: "settings",
                        setting: "sensitivity",
                        value: rangeSensitivity.value
                    }));
                    return;
                }

                let rangeScroll = event.target.closest("#rangeScroll");
                if (rangeScroll) {
                    localStorage.setItem("scroll", rangeScroll.value)
                    socket.send(JSON.stringify({
                        input: "mouse",
                        type: "settings",
                        setting: "scroll",
                        value: rangeScroll.value
                    }))
                    return;
                }
                let pinHotkeys = event.target.closest("#fixedQuick");
                if (pinHotkeys) {
                    localStorage.setItem("fixedQuick", JSON.stringify(pinHotkeys.checked));
                    let containerHotkeys = document.getElementById("container-hotkeys");
                    if (pinHotkeys.checked) {

                        containerHotkeys.classList.remove("notvisible-transform-hotkeys");
                    } else {
                        containerHotkeys.classList.add("notvisible-transform-hotkeys");
                    }
                }
            })

        </script>
</body>

</html>
