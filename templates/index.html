<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteControl</title>
    <style>
        body {
            background-color: #0F032D;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }

        svg,
        svg * {
            pointer-events: none;
        }

        .container {
            box-sizing: border-box;
            position: relative;
            width: 335px;
            margin: 0 auto;
            margin-top: 48px;
            display: flex;
            flex-direction: column;

        }

        .box-change-input {
            margin-bottom: 74px;
        }

        .box-elements {
            width: 100%;
            overflow: hidden;
        }

        .box-controller {
            display: flex;
            width: 200%;
            transition: transform 0.5s ease-in-out;
        }

        .checkbox-btn {
            display: none;
        }

        .checkbox-label {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(to right, #843CEB 0%, #4C00FF 100%);
            border-radius: 100px;
            cursor: pointer;
            transition: background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .checkbox-btn:checked+.checkbox-label {
            background: linear-gradient(to right, #752AD7 0%, #3C00D4 100%);
            color: white;
        }


        .mouse,
        .keyboard {

            width: 50%;
            flex-shrink: 0;
            position: relative;
        }

        .body-mouse {
            border: 4px solid #fff;
            border-radius: 320px 320px 1000px 1000px;
            display: flex;
            flex-direction: column;
            margin-bottom: 48px;
        }

        .mouse-touch {
            background-color: #ffffff08;
            touch-action: none;
            border-radius: 20px 20px 1000px 1000px;
            height: 242px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-touchpad {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 100px;
            width: 56px;
            height: 56px;
            background-color: #FFFFFF16;
            animation: pulse 1.5s infinite
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .border-block {
            border-radius: 20px;
        }

        .touchpad-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .button-mouse {
            width: 126px;
            border: 4px solid #fff;
            height: 184px;
            margin-top: -4px;
        }

        .button-mouse:active {
            background: #FFFFFF16;
        }

        .mouse-left {
            border-radius: 32px 0 0 32px;
            border-right: none;
        }

        .mouse-right {
            border-radius: 0 32px 32px 0;
        }

        .mouse-middle {
            position: absolute;
            width: 40px;
            height: 80px;
            background: linear-gradient(#843CEB 0%, #4C00FF 100%);
            border: 4px solid #fff;
            border-radius: 100px;
            z-index: 3;
            touch-action: none;
        }

        .mouse-middle:active {
            background: linear-gradient(#752AD7 0%, #3C00D4 100%);
        }

        .group-button {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .group-button__center {
            justify-content: center;
        }

        .group-button:not(:last-child) {
            margin-bottom: 48px;
            padding-top: 40px;
        }

        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border: 1px solid #FFFFFF40;
            border-radius: 100px;
        }

        .button:active {
            background: #FFFFFF16;
        }

        .button-command:not(:last-child) {
            margin-right: 24px;
        }

        .keyboard-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            width: 99%;
            margin-bottom: 148px;
            display: flex;
            justify-content: center;
            border: 1px solid #FFFFFF40;
            border-radius: 100px;
        }

        .input-string {
            width: 100%;
            ;
            padding: 0;
            height: 52px;
            color: transparent;
            caret-color: transparent;
            background-color: transparent;
            border: none;
            border-radius: 100px;

        }

        .input-string:active {
            background-color: #FFFFFF16;

        }

        .input-string:active,
        .input-string:focus {
            outline: none;
        }

        .input-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .not-selected {
            border: 1px solid red;
            border-radius: 100px;
        }

        .selected {
            border: 1px solid green;
        }

        #box-quick-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .weight-1 {
            grid-column: span 1;
        }

        .weight-2 {
            grid-column: span 2;
        }

        .weight-3 {
            grid-column: span 3;
        }

        .weight-4 {
            grid-column: span 4;
        }

        .weight-5 {
            grid-column: span 5;
        }
    </style>
    <link rel="shortcut icon" href="#" type="image/x-icon">

</head>

        <script>

            let socket;
            let url = `ws://${window.location.host}/ws`

            let clickCount = 0;
            let clickTimer;
            let isMoving = false;

            let activePointers = new Map();
            let isScrolling = false;
            let isSelectionMode = false;

            const touchpad = document.getElementById('touchpad');

            function connect() {
                console.log("Connection attempt")
                socket = new WebSocket(url)

                socket.onopen = () => {
                    console.log("Connection completed")
                }

                socket.onclose = (e) => {
                    console.log("Connection lost. Reconnection")
                    setTimeout(() => {
                        connect();
                    }, 2000);
                }

                socket.onerror = (err) => {
                    console.log("Connection error. Connection closed")
                    socket.close();
                }
            }

            connect();


            touchpad.addEventListener('pointerdown', (e) => {
                let iconTouchpad = document.getElementsByClassName("icon-touchpad");
                iconTouchpad[0].style.display = "none"
                touchpad.style.background = "#D9D9D916";
                clickCount++;
                clearTimeout(clickTimer)
                isMoving = false;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
                if (clickCount === 1) {
                    clickTimer = setTimeout(() => {
                        if (!isMoving) {
                            socket.send(JSON.stringify({ input: "mouse", type: "clickLeft" }));
                            clickCount = 0
                        }
                    }, 200);
                }
                else if (activePointers.size === 2) {
                    isScrolling = true;
                }
                else if (clickCount === 2) {
                    clearTimeout(clickTimer);
                    socket.send(JSON.stringify({ input: "mouse", type: "dragAndDrop", command: "press" }))
                }

            }, { passive: false });

            touchpad.addEventListener('pointerup', (e) => {
                let iconTouchpad = document.getElementsByClassName("icon-touchpad");
                touchpad.style.background = "#FFFFFF08";
                iconTouchpad[0].style.display = "flex"

                isScrolling = false;
                activePointers.delete(e.pointerId);
                if (clickCount >= 2) {
                    socket.send(JSON.stringify({ input: "mouse", type: "dragAndDrop", command: "release" }))
                    console.log(clickCount)
                    clickCount = 0;
                }

            }, { passive: false });

            let lastSendTime = 0;
            const THROTTTLE_MS = 8;

            touchpad.addEventListener("pointermove", function (e) {
                e.preventDefault();
                isMoving = true;
                clearTimeout(clickTimer)
                if (clickCount < 2 || isScrolling) {
                    clickCount = 0;
                }
                const dx = e.movementX;
                const dy = e.movementY;
                if (Date.now() - lastSendTime > THROTTTLE_MS) {
                    requestAnimationFrame(() => {


                        if (isScrolling) {
                            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                                socket.send(JSON.stringify({ input: "mouse", type: "scroll", y: dy }));
                            }
                        } else {
                            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {

                                socket.send(JSON.stringify({ input: "mouse", type: "move", x: dx, y: dy }));
                            }
                        }
                    })
                }

                lastSendTime = Date.now();

            }, { passive: false });

            // Добавление кнопок быстрого доступа

            let quickButtons = JSON.parse(localStorage.getItem("quickButtons")) || [];
            const containerQuickButtons = document.getElementById("box-quick-buttons");
            quickButtons.sort((a, b) => b.weight - a.weight)

            quickButtons.forEach((elem) => {
                let elementForCopy = document.querySelector(`[data-action-${elem.type}="${elem.action}"]`)
                let elementCopy = elementForCopy.cloneNode(true);
                elementCopy.removeAttribute("data-weight");
                elementCopy.style.marginBottom = "0";
                elementCopy.style.marginRight = "0";
                elementCopy.classList.add(`weight-${elem.weight}`);
                containerQuickButtons.appendChild(elementCopy);
            })

            // Начало инициализации всех кнопок

            document.addEventListener('click', (event) => {
                if (event.target.closest('#touchpad')) {
                    return;
                }
                console.log(isSelectionMode);
                if (isSelectionMode) {
                    let btnChoice = event.target.closest("[data-weight]");
                    console.log(btnChoice)
                    if (btnChoice) {
                        const fullKey = Object.keys(btnChoice.dataset).find(key => key.startsWith('action'));
                        let actionType = '';
                        let actionValue = '';

                        if (fullKey) {
                            actionType = fullKey.replace('action', '').toLowerCase();

                            actionValue = btnChoice.dataset[fullKey];

                            console.log(`Тип: ${actionType}, Значение: ${actionValue}`);
                        }
                        if (btnChoice.classList.contains("input-wrapper")) {
                            actionType = "keyboard";
                            actionValue = "text";
                        }

                        if (checkElementToListLocalStorage(actionValue)) {
                            deleteElementToListLocalStorage(actionValue)

                            btnChoice.classList.add("not-selected");
                            btnChoice.classList.remove('selected');
                        } else {
                            addElementToListLocalStorage({ type: actionType, action: actionValue, weight: btnChoice.dataset.weight })

                            btnChoice.classList.remove("not-selected");
                            btnChoice.classList.add('selected');
                        }
                    }
                    return;
                }

                let btnMouse = event.target.closest("[data-action-mouse]");
                if (btnMouse) {
                    socket.send(JSON.stringify({
                        input: "mouse",
                        type: btnMouse.dataset.actionMouse
                    }))
                    return;
                }

                let btnMedia = event.target.closest("[data-action-media]");
                if (btnMedia) {
                    socket.send(JSON.stringify({ 
                        input: "keyboard", 
                        type: 'key', 
                        value: btnMedia.dataset.actionMedia 
                    }));
                    return;
                }

                let btnCommand = event.target.closest("[data-action-command]");
                if (btnCommand) {
                    socket.send(JSON.stringify({ 
                        input: "keyboard", 
                        type: 'systemCommand', 
                        value: btnCommand.dataset.actionCommand 
                    }));
                    return;
                }
            });


            let middleClick = document.getElementById("middle-click")

            middleClick.addEventListener("pointermove", (e) => {
                const dy = e.movementY;
                if (Math.abs(dy) > 0) {
                    socket.send(JSON.stringify({ input: "mouse", type: "scroll", y: dy }));
                }
            })


            document.addEventListener('beforeinput', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input || !socket || socket.readyState !== WebSocket.OPEN) return;

                let char = e.data;

                if (char) {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'text', value: char }));
                } else if (e.inputType === 'deleteContentBackward') {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'key', value: 'backspace' }));
                } else if (e.inputType === 'insertLineBreak') {
                    socket.send(JSON.stringify({ input: "keyboard", type: 'key', value: 'enter' }));
                }

                input.value = "";
            });

            document.addEventListener('mousedown', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                e.preventDefault();

                if (document.activeElement === input) {
                    input.blur();
                } else {
                    input.focus();
                }
            });

            document.addEventListener('focusin', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                if (isSelectionMode) {
                    input.blur();
                    return;
                }

                const parent = input.closest('.input-wrapper') || input.parentElement;
                const labels = parent.querySelectorAll(".input-label");

                labels.forEach((item) => {
                    item.textContent = "Ввод активирован";
                    input.style.background = 'linear-gradient(to right, #63D72A 0%, #53C121 50%, #3D9A16 100%)';
                });
            });

            document.addEventListener('focusout', (e) => {
                const input = event.target.closest('[data-input]');
                if (!input) return;

                const parent = input.closest('.input-wrapper') || input.parentElement;
                const labels = parent.querySelectorAll(".input-label");

                labels.forEach((item) => {
                    item.textContent = "Активировать ввод";
                    input.style.background = '';
                });
            });

            const checkbox = document.getElementById("changeInput");

            checkbox.addEventListener("change", function () {
                let boxController = document.getElementById("box-controller");
                if (this.checked) {
                    boxController.style.transform = "translateX(-50%)";
                } else {
                    boxController.style.transform = "translateX(0%)";
                }
            })

            const choiceButton = document.getElementById("choiceButton");

            choiceButton.addEventListener("change", function () {
                let elementsChoice = document.querySelectorAll("[data-weight]");
                isSelectionMode = this.checked;
                if (this.checked) {
                    elementsChoice.forEach((elem) => {

                        let command = elem.dataset.actionMedia || elem.dataset.actionCommand || "text";

                        if (checkElementToListLocalStorage(command)) {
                            elem.classList.add("selected")
                        } else {
                            elem.classList.add("not-selected")
                        }

                    })
                } else {
                    elementsChoice.forEach((elem) => {

                        elem.classList.remove("not-selected");
                        elem.classList.remove("selected");
                    })
                }

            })

            function addElementToListLocalStorage(newItem) {
                const currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];

                currentList.push(newItem);

                localStorage.setItem("quickButtons", JSON.stringify(currentList));
            }

            function deleteElementToListLocalStorage(oldCommand) {
                let currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];
                currentList = currentList.filter(item => !(item.action === oldCommand))

                localStorage.setItem("quickButtons", JSON.stringify(currentList))
            }

            function checkElementToListLocalStorage(command) {
                const currentList = JSON.parse(localStorage.getItem("quickButtons")) || [];
                return currentList.some(item => item.action === command);
            }



        </script>
